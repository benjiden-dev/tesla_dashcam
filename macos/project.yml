# XcodeGen manifest — generates DashcamStudio.xcodeproj deterministically.
#   brew install xcodegen && cd macos && xcodegen generate && open DashcamStudio.xcodeproj
#
# The .xcodeproj is intentionally NOT committed (see macos/.gitignore); this
# YAML + the Swift sources are the source of truth.
name: DashcamStudio
options:
  bundleIdPrefix: dev.benjiden
  deploymentTarget:
    macOS: "15.0"
  developmentLanguage: en
  createIntermediateGroups: true

settings:
  base:
    ARCHS: arm64
    ONLY_ACTIVE_ARCH: true
    SWIFT_VERSION: "6.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    DEAD_CODE_STRIPPING: true
    ENABLE_HARDENED_RUNTIME: true

targets:
  DashcamStudio:
    type: application
    platform: macOS
    sources:
      - path: DashcamStudio
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.benjiden.dashcam-studio
        PRODUCT_NAME: Dashcam Studio
        INFOPLIST_FILE: DashcamStudio/Resources/Info.plist
        CODE_SIGN_ENTITLEMENTS: DashcamStudio/Resources/DashcamStudio.entitlements
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        GENERATE_INFOPLIST_FILE: false
        COMBINE_HIDPI_IMAGES: true
        ENABLE_PREVIEWS: true
    entitlements:
      path: DashcamStudio/Resources/DashcamStudio.entitlements
